<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Wireless Survey{% endblock %}</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    /* ── Reset & variables ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #0d1117;
      --bg2:      #161b22;
      --bg3:      #21262d;
      --border:   #30363d;
      --text:     #e6edf3;
      --muted:    #8b949e;
      --accent:   #58a6ff;
      --green:    #3fb950;
      --yellow:   #d29922;
      --red:      #f85149;
      --purple:   #bc8cff;
      --radius:   8px;
      --font:     'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Nav ── */
    nav {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      height: 52px;
      position: sticky; top: 0; z-index: 100;
    }
    .nav-brand {
      font-weight: 700;
      font-size: 1rem;
      color: var(--accent);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      white-space: nowrap;
    }
    .nav-brand svg { flex-shrink: 0; }
    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.875rem;
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
    }
    nav a:hover, nav a.active {
      color: var(--text);
      background: var(--bg3);
    }
    nav a.active { color: var(--accent); }
    .nav-spacer { flex: 1; }
    #nav-connected-ssid {
      font-size: 0.75rem;
      color: var(--green);
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    #nav-connected-ssid::before {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
    }

    /* ── Main layout ── */
    main {
      flex: 1;
      padding: 1.5rem;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }

    /* ── Cards ── */
    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .card-title {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    /* ── Stat grid ── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.75rem;
    }
    .stat {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.875rem 1rem;
    }
    .stat-label { font-size: 0.72rem; color: var(--muted); margin-bottom: 0.25rem; }
    .stat-value { font-size: 1.25rem; font-weight: 700; }

    /* ── Tables ── */
    .tbl-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th {
      text-align: left;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    td { padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--bg3); }

    /* ── Badges ── */
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 99px;
      font-size: 0.7rem;
      font-weight: 600;
    }
    .badge-green  { background: rgba(63,185,80,.15); color: var(--green); }
    .badge-yellow { background: rgba(210,153,34,.15); color: var(--yellow); }
    .badge-red    { background: rgba(248,81,73,.15);  color: var(--red); }
    .badge-blue   { background: rgba(88,166,255,.15); color: var(--accent); }
    .badge-purple { background: rgba(188,140,255,.15);color: var(--purple); }
    .badge-muted  { background: var(--bg3); color: var(--muted); }

    /* ── Signal bar ── */
    .sig-bar-wrap { display: flex; align-items: center; gap: 0.5rem; }
    .sig-bar-bg {
      flex: 1; height: 6px;
      background: var(--bg3);
      border-radius: 3px;
      overflow: hidden;
    }
    .sig-bar { height: 100%; border-radius: 3px; transition: width 0.4s; }

    /* ── Buttons ── */
    button, .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 1rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--text);
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      text-decoration: none;
    }
    button:hover, .btn:hover { background: var(--border); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #0d1117; font-weight: 600; }
    .btn-primary:hover { background: #79b8ff; border-color: #79b8ff; }
    .btn-sm { padding: 0.3rem 0.7rem; font-size: 0.78rem; }

    /* ── Inputs ── */
    input[type=text] {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 0.45rem 0.75rem;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type=text]:focus { border-color: var(--accent); }

    /* ── Code / mono ── */
    pre, code, .mono {
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 0.82rem;
    }
    pre {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--muted);
      max-height: 320px;
      overflow-y: auto;
    }

    /* ── Spinner ── */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Page header ── */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .page-header h1 { font-size: 1.25rem; font-weight: 700; }
    .page-header .meta { font-size: 0.8rem; color: var(--muted); }

    /* ── Row groups ── */
    .row { display: flex; gap: 1rem; flex-wrap: wrap; }
    .col { flex: 1; min-width: 280px; }

    /* ── Hop table colors ── */
    .hop-good  { color: var(--green); }
    .hop-ok    { color: var(--yellow); }
    .hop-slow  { color: var(--red); }
    .hop-none  { color: var(--muted); }
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-brand">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M5 12.55a11 11 0 0 1 14.08 0"/>
      <path d="M10.54 16.1a6 6 0 0 1 2.92 0"/><line x1="12" y1="20" x2="12.01" y2="20"/>
    </svg>
    WireSurvey
  </a>
  <a href="/"           id="nav-dashboard">Dashboard</a>
  <a href="/scanner"    id="nav-scanner">Scanner</a>
  <a href="/diagnostics" id="nav-diagnostics">Diagnostics</a>
  <a href="/history"    id="nav-history">History</a>
  <span class="nav-spacer"></span>
  <span id="nav-connected-ssid">Loading…</span>
</nav>

<main>
  {% block content %}{% endblock %}
</main>

<script>
  // Highlight active nav link
  const path = window.location.pathname;
  const map = { '/': 'nav-dashboard', '/scanner': 'nav-scanner',
                '/diagnostics': 'nav-diagnostics', '/history': 'nav-history' };
  const id = map[path];
  if (id) document.getElementById(id)?.classList.add('active');

  // Show connected SSID
  async function updateConnectedSSID() {
    try {
      const r = await fetch('/api/interface');
      const d = await r.json();
      const el = document.getElementById('nav-connected-ssid');
      el.textContent = d.connected_ssid && d.connected_ssid !== 'N/A'
        ? d.connected_ssid : 'Not connected';
    } catch {}
  }
  updateConnectedSSID();

  // Shared helpers
  function sigColor(rssi) {
    if (rssi >= -60) return '#3fb950';
    if (rssi >= -70) return '#d29922';
    if (rssi >= -80) return '#f0883e';
    return '#f85149';
  }
  function qualityBadge(label) {
    const m = { Excellent: 'badge-green', Good: 'badge-green',
                Fair: 'badge-yellow', Poor: 'badge-red' };
    return `<span class="badge ${m[label] || 'badge-muted'}">${label}</span>`;
  }
  function securityBadge(s) {
    if (s === 'WPA2') return `<span class="badge badge-green">WPA2</span>`;
    if (s === 'WPA')  return `<span class="badge badge-yellow">WPA</span>`;
    if (s === 'Open') return `<span class="badge badge-red">Open</span>`;
    return `<span class="badge badge-muted">${s}</span>`;
  }
  function bandBadge(b) {
    return b === '5 GHz'
      ? `<span class="badge badge-purple">5 GHz</span>`
      : `<span class="badge badge-blue">2.4 GHz</span>`;
  }
</script>

{% block scripts %}{% endblock %}
</body>
</html>
